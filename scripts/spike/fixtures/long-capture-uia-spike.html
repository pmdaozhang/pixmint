<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Pixmint UIA Spike</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #eef1f5;
        color: #18202b;
        font: 14px/1.5 "Segoe UI", sans-serif;
      }
      header,
      footer {
        position: fixed;
        left: 0;
        right: 0;
        z-index: 2;
        height: 56px;
        display: flex;
        align-items: center;
        padding: 0 20px;
        box-sizing: border-box;
      }
      header {
        top: 0;
        background: #1d4ed8;
        color: #fff;
        font-weight: 700;
      }
      footer {
        bottom: 0;
        background: #fff;
        border-top: 1px solid #d9dee7;
      }
      #scroller {
        position: absolute;
        inset: 56px 0;
        overflow-y: auto;
        scroll-behavior: auto;
      }
      #rows {
        padding: 12px 20px;
      }
      .row {
        height: 42px;
        padding: 8px 0;
        border-bottom: 1px solid #d9dee7;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <header>Pixmint UIA Spike · fixed header</header>
    <div id="scroller">
      <div id="rows"></div>
    </div>
    <footer>fixed footer · 1000 rows</footer>
    <script>
      const rows = document.getElementById("rows")
      rows.innerHTML = Array.from({ length: 1000 }, (_, index) => {
        const n = String(index + 1).padStart(4, "0")
        return `<div class="row">ROW-${n} · unique long capture spike content ${n}</div>`
      }).join("")
    </script>
  </body>
</html>
