appId: com.pixmint.desktop
productName: Pixmint
executableName: Pixmint
artifactName: ${productName}-Setup-${version}.${ext}
directories:
  output: release
electronDist: node_modules/electron/dist
files:
  - out/**/*
  - package.json
  - assets/icon.png
  - assets/icon.ico
  - assets/icon-mark.png
  - assets/icon-mark.ico
  - '!node_modules/onnxruntime-node/bin/napi-v6/darwin/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/linux/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32/x64/DirectML.dll'
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32/x64/dxcompiler.dll'
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32/x64/dxil.dll'
asarUnpack:
  - node_modules/onnxruntime-node/**/*
extraResources:
  - from: assets
    to: assets
    filter:
      - icon.png
      - icon.ico
      - icon-mark.png
      - icon-mark.ico
  - from: assets/ocr
    to: ocr
    filter:
      - '*.onnx'
      - '*.txt'
  - from: assets/dict
    to: dict
    filter:
      - '*.json'
asar: true
publish:
  provider: generic
  url: https://pixmint.hugproducthub.top/downloads/
win:
  icon: assets/icon-mark.ico
  target: nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.productivity
