<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Hug 数据台</title>
<style>
  :root {
    --bg: #f5f5f7; --surface: #ffffff; --surface-2: #fbfbfd;
    --text: #1d1d1f; --text-2: #6e6e73; --text-3: #86868b;
    --line: rgba(0,0,0,.08); --line-strong: rgba(0,0,0,.14);
    --accent: #0071e3; --accent-soft: rgba(0,113,227,.10);
    --green: #1d9a3f; --orange: #c26a00; --red: #d70015;
    --sidebar: rgba(255,255,255,.78);
    --shadow-1: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.04);
    --shadow-2: 0 12px 40px rgba(0,0,0,.16);
    --radius: 16px; --radius-sm: 10px;
    --focus: 0 0 0 4px rgba(0,113,227,.28);
  }
  [data-theme="dark"] {
    --bg: #000000; --surface: #1c1c1e; --surface-2: #232325;
    --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #8e8e93;
    --line: rgba(255,255,255,.10); --line-strong: rgba(255,255,255,.18);
    --accent: #0a84ff; --accent-soft: rgba(10,132,255,.16);
    --green: #32d74b; --orange: #ff9f0a; --red: #ff453a;
    --sidebar: rgba(28,28,30,.82);
    --shadow-1: 0 1px 2px rgba(0,0,0,.5);
    --shadow-2: 0 20px 60px rgba(0,0,0,.6);
    --focus: 0 0 0 4px rgba(10,132,255,.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 13px; line-height: 1.5; color: var(--text); background: var(--bg);
    -webkit-font-smoothing: antialiased; letter-spacing: -.005em;
    transition: background .25s ease, color .25s ease;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: none; box-shadow: var(--focus); }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  [hidden] { display: none !important; }

  /* 登录 */
  .login-page { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .login-card {
    width: min(360px, 92vw); padding: 32px 28px 26px; text-align: center;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 22px; box-shadow: var(--shadow-2);
  }
  .brand-mark {
    width: 44px; height: 44px; border-radius: 13px; margin: 0 auto 14px;
    background: linear-gradient(160deg, #0a84ff, #0051a8);
    display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 17px;
  }
  .login-title { font-size: 17px; font-weight: 600; }
  .login-sub { font-size: 12px; color: var(--text-2); margin: 4px 0 20px; }
  .field { text-align: left; margin-bottom: 12px; }
  .field label { display: block; font-size: 11px; color: var(--text-2); margin-bottom: 5px; }
  .field input {
    width: 100%; padding: 10px 12px; font-size: 13px; color: var(--text);
    background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 10px;
  }
  .btn {
    padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 500;
    border: 1px solid var(--line-strong); background: var(--surface);
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
  .btn.ghost { color: var(--text-2); }
  .login-card .btn { width: 100%; margin-top: 6px; padding: 10px; }
  .login-hint { font-size: 11px; color: var(--text-3); margin-top: 12px; min-height: 16px; }
  .login-hint.error { color: var(--red); }

  /* 布局 */
  .app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
  .sidebar {
    position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
    padding: 18px 12px; background: var(--sidebar);
    -webkit-backdrop-filter: saturate(180%) blur(24px);
    backdrop-filter: saturate(180%) blur(24px);
    border-right: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 9px; padding: 6px 10px 18px; }
  .brand .brand-mark { width: 26px; height: 26px; border-radius: 8px; font-size: 13px; margin: 0; }
  .brand-name { font-size: 13px; font-weight: 600; }
  .brand-sub { font-size: 11px; color: var(--text-3); }
  .nav-label { font-size: 11px; font-weight: 600; color: var(--text-3); padding: 0 10px; margin: 6px 0 8px; letter-spacing: .04em; }
  .tool-item {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px;
    border-radius: var(--radius-sm); text-align: left; color: var(--text-2);
    transition: background .15s ease, color .15s ease;
  }
  .tool-item:hover { background: var(--accent-soft); color: var(--text); }
  .tool-item[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .tool-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); flex: none; }
  .tool-item[aria-current="true"] .tool-dot { background: var(--accent); }
  .tool-meta { margin-left: auto; font-size: 11px; color: var(--text-3); font-weight: 400; }
  .add-tool {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 10px; margin-top: 2px;
    border-radius: var(--radius-sm); border: 1px dashed var(--line-strong);
    color: var(--text-2); font-size: 12px;
  }
  .add-tool:hover { border-color: var(--accent); color: var(--accent); }
  .sidebar-foot { margin-top: auto; display: grid; gap: 2px; }
  .foot-btn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 10px; border-radius: var(--radius-sm); color: var(--text-2); font-size: 12px; }
  .foot-btn:hover { background: var(--accent-soft); color: var(--text); }

  .main { padding: 26px 32px 48px; width: 100%; }
  .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
  .page-title { font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
  .page-sub { font-size: 13px; color: var(--text-2); margin-top: 2px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .segmented { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-1); }
  .segmented button { padding: 5px 12px; border-radius: 8px; font-size: 12px; color: var(--text-2); }
  .segmented button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 500; }
  .icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-1); color: var(--text-2); font-size: 13px; }
  .icon-btn:hover { color: var(--text); border-color: var(--line-strong); }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow-1); }
  .stat-label { font-size: 12px; color: var(--text-2); }
  .stat-value { font-size: 32px; font-weight: 600; letter-spacing: -.03em; margin-top: 6px; line-height: 1.1; }
  .stat-delta { font-size: 12px; margin-top: 4px; color: var(--text-3); }
  .up { color: var(--green); } .down { color: var(--red); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px 16px; box-shadow: var(--shadow-1); }
  .card + .card { margin-top: 18px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .card-title { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .card-sub { font-size: 11px; color: var(--text-3); }

  .chart-wrap { position: relative; height: 260px; }
  .chart-svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .grid-line { stroke: var(--line); stroke-width: 1; }
  .axis-label { fill: var(--text-3); font-size: 10px; }
  .line-path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .area-path { fill: url(#areaFill); }
  .hover-dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2; visibility: hidden; }
  .hover-dot.show { visibility: visible; }
  .tooltip { position: absolute; pointer-events: none; opacity: 0; transform: translate(-50%, -120%); background: var(--text); color: var(--bg); padding: 5px 9px; border-radius: 8px; font-size: 11px; white-space: nowrap; transition: opacity .12s ease; }

  .filters { display: flex; gap: 8px; }
  .chip { padding: 5px 11px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); color: var(--text-2); background: var(--surface); }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: transparent; font-weight: 500; }

  .fb-list { display: grid; gap: 2px; margin-top: 4px; }
  .fb-row { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; width: 100%; padding: 12px 10px; border-radius: 12px; text-align: left; transition: background .15s ease; }
  .fb-row:hover { background: var(--surface-2); }
  .fb-avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft); }
  .fb-main { min-width: 0; }
  .fb-title { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .fb-snippet { color: var(--text-2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .fb-meta { font-size: 11px; color: var(--text-3); margin-top: 3px; display: flex; gap: 10px; }
  .tag { font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--text-2); letter-spacing: .02em; flex: none; }
  .tag.bug { color: var(--red); border-color: color-mix(in srgb, var(--red) 34%, transparent); }
  .tag.idea { color: var(--orange); border-color: color-mix(in srgb, var(--orange) 34%, transparent); }
  .status { font-size: 11px; color: var(--text-3); white-space: nowrap; }
  .status.open { color: var(--accent); }
  .status.rejected { color: var(--red); }
  .status.expired { color: var(--orange); }
  .status.done { color: var(--green); }
  .empty { padding: 36px 16px; text-align: center; color: var(--text-3); font-size: 12px; line-height: 1.8; }
  .empty strong { display: block; color: var(--text-2); font-size: 13px; margin-bottom: 4px; }

  /* 订单 */
  .order-summary { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .order-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border: 1px solid var(--line); border-radius: 999px; color: var(--text-2); font-size: 12px; background: var(--surface); }
  .order-pill strong { color: var(--text); font-weight: 600; }
  .order-search { margin-bottom: 10px; }
  .order-search input { width: 100%; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); font-size: 12.5px; outline: none; }
  .order-search input:focus { border-color: var(--accent); }
  .order-list { display: grid; gap: 8px; }
  .order-row { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .order-main { min-width: 0; }
  .order-title { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
  .order-title code { font-size: 13px; font-weight: 600; letter-spacing: .02em; }
  .order-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--text-2); font-size: 12px; line-height: 1.7; }
  .order-meta-dim { color: var(--text-3); font-size: 11px; }
  .order-warn { color: var(--red); }
  .order-note { margin-top: 6px; color: var(--red); font-size: 12px; }
  .order-code { display: flex; align-items: center; gap: 8px; margin-top: 7px; color: var(--text-3); font-size: 11px; }
  .order-code code { overflow: hidden; max-width: 240px; color: var(--text-2); font-family: var(--mono); text-overflow: ellipsis; white-space: nowrap; }
  .order-actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .mini { height: 30px; padding: 0 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--text-2); font-size: 12px; }
  .mini:hover { color: var(--text); }
  .mini.primary { border-color: transparent; background: var(--text); color: var(--bg); font-weight: 600; }
  .mini:disabled { opacity: .5; }
  @media (max-width: 720px) {
    .order-row { grid-template-columns: 1fr; }
    .order-actions { justify-content: flex-start; }
  }

  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.32); opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 40; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(440px, 92vw); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow-2); z-index: 41; transform: translateX(100%); transition: transform .28s cubic-bezier(.32,.72,0,1); display: flex; flex-direction: column; }
  .drawer.show { transform: translateX(0); }
  .drawer-head { padding: 20px 22px 14px; border-bottom: 1px solid var(--line); }
  .drawer-body { padding: 18px 22px; overflow: auto; flex: 1; }
  .drawer-foot { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; gap: 10px; }
  .kv { display: grid; grid-template-columns: 76px 1fr; gap: 8px 12px; font-size: 12px; }
  .kv dt { color: var(--text-3); }
  .attach-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .attach-grid img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); cursor: zoom-in; background: var(--surface-2); }
  .attach-empty { font-size: 12px; color: var(--text-3); margin-top: 12px; }
  .lightbox { position: fixed; inset: 0; z-index: 80; display: none; place-items: center; padding: 24px; background: rgba(0,0,0,.72); cursor: zoom-out; }
  .lightbox.show { display: grid; }
  .lightbox img { max-width: 92vw; max-height: 88vh; border-radius: 12px; box-shadow: var(--shadow-2); background: #fff; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .18s ease; z-index: 90; }
  .toast.show { opacity: 1; }
  .quote { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; line-height: 1.7; white-space: pre-wrap; }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; flex-direction: row; align-items: center; flex-wrap: wrap; gap: 6px; border-right: 0; border-bottom: 1px solid var(--line); }
    .brand { padding: 4px 8px 4px 2px; }
    .nav-label, .add-tool, .tool-meta { display: none; }
    .sidebar-foot { margin: 0 0 0 auto; display: flex; }
    .foot-btn span { display: none; }
    .main { padding: 18px 16px 40px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<!-- 登录 -->
<div class="login-page" id="loginView">
  <form class="login-card" id="loginForm">
    <div class="brand-mark">H</div>
    <div class="login-title">登录 Hug 数据台</div>
    <div class="login-sub">仅限管理员 · data.hugproducthub.top</div>
    <div class="field">
      <label for="username">账号</label>
      <input id="username" name="username" autocomplete="username" required />
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
    </div>
    <button class="btn primary" type="submit" id="loginBtn">登录</button>
    <div class="login-hint" id="loginHint"></div>
  </form>
</div>

<!-- 后台 -->
<div class="app" id="appView" hidden>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">H</div>
      <div>
        <div class="brand-name">Hug 数据台</div>
        <div class="brand-sub">data.hugproducthub.top</div>
      </div>
    </div>
    <div class="nav-label">工具</div>
    <div id="toolList"></div>
    <button class="add-tool" disabled title="后续开放">＋ 接入新工具</button>
    <div class="sidebar-foot">
      <button class="foot-btn" id="themeBtn">◐ <span>切换外观</span></button>
      <button class="foot-btn" id="logoutBtn">⏻ <span>退出登录</span></button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 class="page-title">概览</h1>
        <p class="page-sub" id="pageSub">—</p>
      </div>
    </div>

    <section class="stats">
      <article class="stat">
        <div class="stat-label">累计下载</div>
        <div class="stat-value num" id="totalDownloads">—</div>
        <div class="stat-delta" id="totalDelta">全部时间</div>
      </article>
      <article class="stat">
        <div class="stat-label">今日下载</div>
        <div class="stat-value num" id="todayDownloads">—</div>
        <div class="stat-delta">北京时间</div>
      </article>
      <article class="stat">
        <div class="stat-label">近 7 天</div>
        <div class="stat-value num" id="weekDownloads">—</div>
        <div class="stat-delta" id="weekAvg">—</div>
      </article>
      <article class="stat">
        <div class="stat-label">待处理反馈</div>
        <div class="stat-value num" id="openFeedback">—</div>
        <div class="stat-delta" id="openFeedbackSub">—</div>
      </article>
    </section>

    <section class="card">
      <div class="card-head">
        <div>
          <h2 class="card-title">下载趋势</h2>
          <span class="card-sub" id="chartSub">最近 30 天 · 单位：次</span>
        </div>
        <div class="segmented" role="group" aria-label="下载趋势时间范围">
          <button data-range="7" aria-pressed="false">7 天</button>
          <button data-range="30" aria-pressed="true">30 天</button>
          <button data-range="90" aria-pressed="false">90 天</button>
        </div>
      </div>
      <div class="chart-wrap">
        <svg class="chart-svg" id="chart" viewBox="0 0 640 260" preserveAspectRatio="none" role="img" aria-label="下载趋势图">
          <defs>
            <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--accent)" stop-opacity=".26" />
              <stop offset="100%" stop-color="var(--accent)" stop-opacity="0" />
            </linearGradient>
          </defs>
          <g id="gridLines"></g>
          <path id="areaPath" class="area-path" d="" />
          <path id="linePath" class="line-path" d="" />
          <g id="xLabels"></g>
          <circle id="hoverDot" class="hover-dot" r="3.5" cx="-10" cy="-10" />
        </svg>
        <div class="tooltip" id="tooltip"></div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 class="card-title">问题反馈</h2>
        <div class="filters" role="group" aria-label="反馈筛选">
          <button class="chip" aria-pressed="true" data-filter="all">全部</button>
          <button class="chip" aria-pressed="false" data-filter="open">未处理</button>
          <button class="chip" aria-pressed="false" data-filter="done">已处理</button>
        </div>
      </div>
      <div class="fb-list" id="fbList"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <div>
          <h2 class="card-title">订单</h2>
          <span class="card-sub" id="orderSub">人工收款 · 确认后自动发码并激活</span>
        </div>
        <div class="filters" role="group" aria-label="订单筛选" id="orderFilters">
          <button class="chip" data-order-filter="reviewing" aria-pressed="true">待确认</button>
          <button class="chip" data-order-filter="all" aria-pressed="false">全部</button>
          <button class="chip" data-order-filter="paid" aria-pressed="false">已付款</button>
          <button class="chip" data-order-filter="rejected" aria-pressed="false">已拒绝</button>
        </div>
      </div>
      <div class="order-summary" id="orderSummary"></div>
      <div class="order-search">
        <input id="orderSearch" type="search" placeholder="搜索订单号 / 邮箱 / 设备" autocomplete="off" />
      </div>
      <div class="order-list" id="orderList"></div>
    </section>
  </main>
</div>

<div class="lightbox" id="lightbox" aria-hidden="true"><img id="lightboxImg" alt="截图预览" /></div>
<div class="toast" id="toast" role="status"></div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="反馈详情">
  <div class="drawer-head">
    <div class="card-title" id="dTitle">反馈详情</div>
    <div class="card-sub" id="dSub">—</div>
  </div>
  <div class="drawer-body">
    <dl class="kv" id="dMeta"></dl>
    <div class="quote" id="dContent"></div>
    <div class="attach-grid" id="dAttach"></div>
  </div>
  <div class="drawer-foot">
    <button class="btn primary" id="dResolve">标记为已处理</button>
    <button class="btn ghost" id="dClose">关闭</button>
  </div>
</aside>

<script>
(() => {
  const state = {
    tool: "pixmint",
    range: 30,
    filter: "all",
    tools: [],
    items: [],
    current: null,
    orderFilter: "reviewing",
    orderQuery: "",
    orders: [],
    orderSummary: {},
  };

  const $ = (s) => document.querySelector(s);
  const fmt = (n) => Number(n || 0).toLocaleString("en-US");

  /* 统一请求封装：401 直接回登录页，避免各处重复判断 */
  async function api(path, options = {}) {
    const res = await fetch(path, {
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      ...options,
    });
    if (res.status === 401) { showLogin(); throw new Error("unauthorized"); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error || "request_failed"), { status: res.status, data });
    return data;
  }

  function showLogin() {
    $("#appView").hidden = true;
    $("#loginView").hidden = false;
    $("#password").value = "";
  }
  function showApp() {
    $("#loginView").hidden = true;
    $("#appView").hidden = false;
  }

  /* ---------------- 登录 ---------------- */
  $("#loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const hint = $("#loginHint");
    hint.classList.remove("error");
    hint.textContent = "登录中…";
    try {
      await api("/api/admin/login", {
        method: "POST",
        body: JSON.stringify({
          username: $("#username").value.trim(),
          password: $("#password").value,
        }),
      });
      hint.textContent = "";
      await boot();
    } catch (err) {
      if (err.status === 429) {
        hint.textContent = `尝试次数过多，请 ${Math.ceil((err.data?.retry_after || 300) / 60)} 分钟后再试`;
      } else {
        hint.textContent = "账号或密码不正确";
      }
      hint.classList.add("error");
    }
  });

  $("#logoutBtn").addEventListener("click", async () => {
    try { await api("/api/admin/logout", { method: "POST" }); } catch (_) {}
    showLogin();
  });

  /* ---------------- 数据加载 ---------------- */
  async function loadTools() {
    const data = await api("/api/admin/tools");
    state.tools = data.tools || [];
    if (state.tools.length && !state.tools.some((t) => t.slug === state.tool)) {
      state.tool = state.tools[0].slug;
    }
    $("#toolList").innerHTML = state.tools.map((t) => `
      <button class="tool-item" data-slug="${t.slug}" aria-current="${t.slug === state.tool}">
        <span class="tool-dot"></span><span>${t.name}</span>
        <span class="tool-meta num">${fmt(t.total)}</span>
      </button>`).join("");

    const cur = state.tools.find((t) => t.slug === state.tool);
    $("#pageSub").textContent = cur ? `${cur.name} · ${cur.download_file || "未配置安装包"}` : "—";
  }

  async function loadOverview() {
    const d = await api(`/api/admin/overview?tool=${encodeURIComponent(state.tool)}&range=${state.range}`);
    $("#totalDownloads").textContent = fmt(d.totals.total);
    $("#todayDownloads").textContent = fmt(d.totals.today);
    $("#weekDownloads").textContent = fmt(d.totals.week);
    $("#weekAvg").textContent = `日均 ${Math.round(d.totals.week / 7)} 次`;
    $("#openFeedback").textContent = fmt(d.feedback.open);
    $("#openFeedbackSub").textContent = d.feedback.total ? `共 ${d.feedback.total} 条` : "暂无反馈";
    $("#chartSub").textContent = `最近 ${d.range} 天 · 单位：次`;
    drawChart(d.series.map((x) => x.count), d.series.map((x) => x.day));
  }

  async function loadFeedback() {
    const q = new URLSearchParams({ tool: state.tool, status: state.filter });
    const d = await api(`/api/admin/feedback?${q}`);
    state.items = d.items || [];
    renderFeedback();
  }

  function renderFeedback() {
    const box = $("#fbList");
    if (!state.items.length) {
      box.innerHTML = `<div class="empty"><strong>还没有反馈</strong>
        客户端接入反馈入口后，用户提交的内容会出现在这里。</div>`;
      return;
    }
    const label = { bug: "Bug", idea: "建议", other: "咨询" };
    const initial = { bug: "B", idea: "I", other: "Q" };
    box.innerHTML = state.items.map((f) => {
      const snippet = f.content.replace(/\s+/g, " ").slice(0, 46);
      return `<button class="fb-row" data-id="${f.id}">
        <span class="fb-avatar">${initial[f.type] || "?"}</span>
        <span class="fb-main">
          <span class="fb-title"><span class="tag ${f.type}">${label[f.type] || f.type}</span>${escapeHtml(snippet)}</span>
          <span class="fb-snippet">${escapeHtml(f.content.replace(/\s+/g, " ").slice(0, 90))}</span>
          <span class="fb-meta"><span class="num">v${escapeHtml(f.version || "-")}</span><span>${escapeHtml(f.os || "")}</span><span>${fmtTime(f.created_at)}</span></span>
        </span>
        <span class="status ${f.status === "open" ? "open" : ""}">${f.status === "open" ? "未处理" : "已处理"}</span>
      </button>`;
    }).join("");
  }

  /* ---------------- 订单 ---------------- */
  const ORDER_STATUS = {
    pending_payment: { label: "待付款", cls: "" },
    reviewing: { label: "待确认", cls: "open" },
    paid: { label: "已付款", cls: "done" },
    rejected: { label: "已拒绝", cls: "rejected" },
    expired: { label: "已过期", cls: "expired" },
  };
  const PLAN_LABEL = { monthly: "月付", yearly: "年付", lifetime: "终身" };
  const fmtMoney = (cents) => {
    const value = Number(cents || 0);
    return `¥${(value / 100).toFixed(value % 100 === 0 ? 0 : 2)}`;
  };
  function fmtEpoch(seconds) {
    if (!seconds) return "—";
    const d = new Date(Number(seconds) * 1000);
    const p = (n) => String(n).padStart(2, "0");
    return `${d.getMonth() + 1}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  async function loadOrders() {
    const q = new URLSearchParams();
    if (state.orderFilter !== "all") q.set("status", state.orderFilter);
    if (state.orderQuery) q.set("q", state.orderQuery);
    try {
      const d = await api(`/api/admin/manual-orders?${q}`);
      state.orders = d.orders || [];
      state.orderSummary = d.summary || {};
      renderOrders();
    } catch (err) {
      $("#orderList").innerHTML = `<div class="empty"><strong>订单加载失败</strong>${escapeHtml(err.message || "请检查授权服务")}</div>`;
    }
  }

  function renderOrders() {
    const summary = state.orderSummary || {};
    const pending =
      (summary.reviewing?.count || 0) + (summary.pending_payment?.count || 0);
    const paid = summary.paid?.count || 0;
    const revenue = summary.paid?.amountCents || 0;
    $("#orderSub").textContent = pending
      ? `${pending} 笔待确认`
      : "人工收款 · 确认后自动发码并激活";
    $("#orderSummary").innerHTML = `
      <span class="order-pill"><strong class="num">${fmt(pending)}</strong> 待确认</span>
      <span class="order-pill"><strong class="num">${fmt(paid)}</strong> 已付款</span>
      <span class="order-pill"><strong class="num">${fmtMoney(revenue)}</strong> 累计收入</span>`;
    const box = $("#orderList");
    if (!state.orders.length) {
      box.innerHTML = `<div class="empty"><strong>没有订单</strong>用户在软件里下单后，订单会出现在这里。</div>`;
      return;
    }
    box.innerHTML = state.orders
      .map((o) => {
        const st = ORDER_STATUS[o.status] || { label: o.status, cls: "" };
        const canConfirm = o.status === "reviewing" || o.status === "pending_payment";
        const code = o.licenseCode || "";
        return `<div class="order-row">
          <div class="order-main">
            <div class="order-title">
              <code>${escapeHtml(o.orderNumber || o.orderId)}</code>
              <span class="status ${st.cls}">${st.label}</span>
            </div>
            <div class="order-meta">
              <span>${PLAN_LABEL[o.plan] || escapeHtml(o.plan)}</span>
              <span class="num">${fmtMoney(o.amountCents)}</span>
              <span>${fmtEpoch(o.createdAt)}</span>
            </div>
            <div class="order-meta order-meta-dim">
              <span>设备 ${escapeHtml(o.deviceName || "未命名")}</span>
              <span class="num">${escapeHtml((o.deviceId || "").slice(0, 12))}</span>
            </div>
            ${o.rejectReason ? `<div class="order-note">拒绝原因：${escapeHtml(o.rejectReason)}</div>` : ""}
            ${code ? `<div class="order-code">激活码 <code>${escapeHtml(code.slice(0, 28))}…</code><button class="mini" data-action="copy" data-code="${escapeHtml(code)}">复制</button></div>` : ""}
          </div>
          <div class="order-actions">
            ${canConfirm ? `<button class="mini primary" data-action="confirm" data-id="${escapeHtml(o.orderId)}" data-email="${escapeHtml(o.email || "")}">确认收款</button>` : ""}
            ${canConfirm ? `<button class="mini" data-action="reject" data-id="${escapeHtml(o.orderId)}">拒绝</button>` : ""}
            ${canConfirm ? `<button class="mini" data-action="notify" data-id="${escapeHtml(o.orderId)}">重发通知</button>` : ""}
            ${o.status === "rejected" ? `<button class="mini" data-action="reopen" data-id="${escapeHtml(o.orderId)}">恢复待确认</button>` : ""}
            ${o.status === "paid" ? `<button class="mini" data-action="revoke" data-id="${escapeHtml(o.orderId)}">撤销确认</button>` : ""}
          </div>
        </div>`;
      })
      .join("");
  }

  /* ---------------- 图表 ---------------- */
  let chartMeta = null;
  function drawChart(values, days) {
    const svg = $("#chart");
    /* 关键：viewBox 必须等于容器实际像素宽，1 单位 = 1 像素，
       否则 preserveAspectRatio=none 会把坐标轴文字横向拉变形 */
    const W = Math.max(320, Math.floor(svg.parentElement.clientWidth || 640));
    const H = 260, P = { l: 6, r: 6, t: 14, b: 26 };
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    const peak = Math.max(1, ...values);
    const max = peak * 1.12;
    const stepX = (W - P.l - P.r) / Math.max(1, values.length - 1);
    const y = (v) => P.t + (H - P.t - P.b) * (1 - v / max);
    const pts = values.map((v, i) => [P.l + i * stepX, y(v)]);
    const line = pts.map(([x, yy], i) => `${i ? "L" : "M"}${x.toFixed(1)} ${yy.toFixed(1)}`).join(" ");
    const area = `${line} L ${pts.at(-1)[0].toFixed(1)} ${H - P.b} L ${P.l} ${H - P.b} Z`;

    $("#linePath").setAttribute("d", line);
    $("#areaPath").setAttribute("d", area);

    const g = $("#gridLines");
    g.innerHTML = "";
    for (let i = 0; i <= 4; i++) {
      const yy = P.t + (H - P.t - P.b) * (i / 4);
      const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
      l.setAttribute("x1", P.l); l.setAttribute("x2", W - P.r);
      l.setAttribute("y1", yy); l.setAttribute("y2", yy);
      l.setAttribute("class", "grid-line");
      g.appendChild(l);
    }
    const maxLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
    maxLabel.setAttribute("x", W - P.r); maxLabel.setAttribute("y", P.t - 2);
    maxLabel.setAttribute("text-anchor", "end"); maxLabel.setAttribute("class", "axis-label");
    maxLabel.textContent = Math.round(peak);
    g.appendChild(maxLabel);

    const labels = $("#xLabels");
    labels.innerHTML = "";
    [0, Math.floor(values.length / 2), values.length - 1].forEach((i, idx) => {
      const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
      t.setAttribute("x", (P.l + i * stepX).toFixed(1));
      t.setAttribute("y", H - 6);
      t.setAttribute("text-anchor", idx === 0 ? "start" : idx === 2 ? "end" : "middle");
      t.setAttribute("class", "axis-label");
      t.textContent = (days[i] || "").slice(5).replace("-", "/");
      labels.appendChild(t);
    });

    chartMeta = { pts, stepX, days, values, W };
  }

  (function bindHover() {
    const svg = $("#chart"), tip = $("#tooltip"), dot = $("#hoverDot");
    svg.addEventListener("mousemove", (e) => {
      if (!chartMeta) return;
      const rect = svg.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * chartMeta.W;
      let i = Math.round((x - 6) / chartMeta.stepX);
      i = Math.max(0, Math.min(chartMeta.values.length - 1, i));
      const [px, py] = chartMeta.pts[i];
      dot.setAttribute("cx", px); dot.setAttribute("cy", py); dot.classList.add("show");
      const d = chartMeta.days[i] || "";
      tip.textContent = `${d.slice(5).replace("-", "月")}日 · ${chartMeta.values[i]} 次`;
      tip.style.left = (px / chartMeta.W) * rect.width + "px";
      tip.style.top = (py / 260) * rect.height + "px";
      tip.style.opacity = 1;
    });
    svg.addEventListener("mouseleave", () => { tip.style.opacity = 0; dot.classList.remove("show"); });
  })();

  /* 视口变化时重绘，保证 viewBox 与容器宽度一致 */
  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (chartMeta) drawChart(chartMeta.values, chartMeta.days);
    }, 150);
  });

  /* ---------------- 交互 ---------------- */
  document.querySelectorAll("[data-range]").forEach((b) => {
    b.addEventListener("click", async () => {
      document.querySelectorAll("[data-range]").forEach((x) => x.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true");
      state.range = Number(b.dataset.range);
      await loadOverview();
    });
  });

  document.querySelectorAll("[data-filter]").forEach((b) => {
    b.addEventListener("click", async () => {
      document.querySelectorAll("[data-filter]").forEach((x) => x.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true");
      state.filter = b.dataset.filter;
      await loadFeedback();
    });
  });

  document.querySelectorAll("[data-order-filter]").forEach((b) => {
    b.addEventListener("click", async () => {
      document.querySelectorAll("[data-order-filter]").forEach((x) => x.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true");
      state.orderFilter = b.dataset.orderFilter;
      await loadOrders();
    });
  });

  let orderSearchTimer = null;
  $("#orderSearch").addEventListener("input", (e) => {
    state.orderQuery = e.target.value.trim();
    clearTimeout(orderSearchTimer);
    orderSearchTimer = setTimeout(() => { loadOrders(); }, 300);
  });

  $("#orderList").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const action = btn.dataset.action;
    if (action === "copy") {
      try {
        await navigator.clipboard.writeText(btn.dataset.code || "");
        toast("激活码已复制");
      } catch (_) {
        toast("复制失败", true);
      }
      return;
    }
    const id = btn.dataset.id;
    if (!id) return;
    if (action === "notify") {
      btn.disabled = true;
      try {
        const r = await api(`/api/admin/manual-orders/${encodeURIComponent(id)}/notify`, {
          method: "POST",
          body: JSON.stringify({}),
        });
        toast(r.ok ? "已重发通知" : "通知发送失败，请检查企业微信配置", !r.ok);
        await loadOrders();
      } catch (err) {
        toast(`操作失败：${err.message || "网络错误"}`, true);
      } finally {
        btn.disabled = false;
      }
      return;
    }
    if (action === "reopen") {
      if (!confirm("恢复这笔已拒绝的订单到待确认？")) return;
      btn.disabled = true;
      try {
        await api(`/api/admin/manual-orders/${encodeURIComponent(id)}/reopen`, {
          method: "POST",
          body: JSON.stringify({}),
        });
        toast("已恢复为待确认");
        await loadOrders();
      } catch (err) {
        toast(`操作失败：${err.message || "网络错误"}`, true);
      } finally {
        btn.disabled = false;
      }
      return;
    }
    if (action === "revoke") {
      if (!confirm("撤销确认会立即吊销该订单的授权，用户会失去 Pro。确定撤销？")) return;
      btn.disabled = true;
      try {
        await api(`/api/admin/manual-orders/${encodeURIComponent(id)}/revoke`, {
          method: "POST",
          body: JSON.stringify({}),
        });
        toast("已撤销确认，授权已吊销");
        await loadOrders();
      } catch (err) {
        toast(`操作失败：${err.message || "网络错误"}`, true);
      } finally {
        btn.disabled = false;
      }
      return;
    }
    if (action === "reject") {
      const reason = prompt("拒绝原因（用户会在软件里看到）", "未查到对应金额，请确认付款备注订单号");
      if (reason === null) return;
      btn.disabled = true;
      try {
        await api(`/api/admin/manual-orders/${encodeURIComponent(id)}/reject`, {
          method: "POST",
          body: JSON.stringify({ reason }),
        });
        toast("已拒绝该订单");
        await loadOrders();
      } catch (err) {
        toast(`操作失败：${err.message || "网络错误"}`, true);
      } finally {
        btn.disabled = false;
      }
      return;
    }
    if (action === "confirm") {
      if (!confirm("确认收款并激活订单？")) return;
      btn.disabled = true;
      try {
        const r = await api(`/api/admin/manual-orders/${encodeURIComponent(id)}/confirm`, {
          method: "POST",
          body: JSON.stringify({}),
        });
        if (r.status === "paid" || r.code) {
          toast("已确认收款，激活码已生成");
        } else {
          toast("确认失败：服务端未返回已支付状态", true);
        }
        await loadOrders();
      } catch (err) {
        toast(`操作失败：${err.message || "网络错误"}`, true);
      } finally {
        btn.disabled = false;
      }
    }
  });

  $("#toolList").addEventListener("click", async (e) => {
    const btn = e.target.closest(".tool-item");
    if (!btn || btn.dataset.slug === state.tool) return;
    state.tool = btn.dataset.slug;
    document.querySelectorAll(".tool-item").forEach((el) => el.setAttribute("aria-current", String(el.dataset.slug === state.tool)));
    await Promise.all([loadOverview(), loadFeedback(), loadOrders()]);
    await loadTools();
  });

  $("#fbList").addEventListener("click", (e) => {
    const row = e.target.closest(".fb-row");
    if (!row) return;
    const item = state.items.find((x) => String(x.id) === row.dataset.id);
    if (item) openDrawer(item);
  });

  async function openDrawer(f) {
    const label = { bug: "Bug", idea: "建议", other: "咨询" };
    $("#dTitle").textContent = `${label[f.type] || f.type} · #${f.id}`;
    $("#dSub").textContent = fmtTime(f.created_at);
    $("#dMeta").innerHTML = `<dt>版本</dt><dd class="num">${escapeHtml(f.version || "-")}</dd>`;
    $("#dContent").textContent = f.content;
    $("#dAttach").innerHTML = "";
    $("#drawer").classList.add("show");
    $("#scrim").classList.add("show");

    // 详情包含 platform / os_version / arch 与截图，单独拉一次
    let detail = null;
    try { detail = (await api(`/api/admin/feedback/fb_${f.id}`)).item; } catch (_) {}

    const d = detail || f;
    const sys = [d.platform, d.os_version, d.arch].filter(Boolean).join(" · ") || d.os || "-";
    $("#dMeta").innerHTML = `
      <dt>版本</dt><dd class="num">${escapeHtml(d.version || "-")}</dd>
      <dt>系统</dt><dd>${escapeHtml(sys)}</dd>
      <dt>联系方式</dt><dd>${escapeHtml(d.contact || "未留")}</dd>
      <dt>状态</dt><dd>${d.status === "open" ? "未处理" : "已处理"}</dd>`;
    $("#dContent").textContent = d.content;
    state.current = d;

    const atts = d.attachments || [];
    $("#dAttach").innerHTML = atts.length
      ? atts.map((a) => `<img src="/api/admin/attachments/${a.id}" alt="用户截图" loading="lazy" data-aid="${a.id}" />`).join("")
      : `<span class="attach-empty">没有截图</span>`;

    $("#dResolve").textContent = d.status === "open" ? "标记为已处理" : "标记为未处理";
  }
  function closeDrawer() {
    $("#drawer").classList.remove("show");
    $("#scrim").classList.remove("show");
  }
  /* 点击缩略图在当前页放大，不跳新标签 */
  $("#dAttach").addEventListener("click", (e) => {
    const img = e.target.closest("img[data-aid]");
    if (!img) return;
    $("#lightboxImg").src = img.src;
    $("#lightbox").classList.add("show");
    $("#lightbox").setAttribute("aria-hidden", "false");
  });
  $("#lightbox").addEventListener("click", closeLightbox);
  $("#scrim").addEventListener("click", closeDrawer);
  $("#dClose").addEventListener("click", closeDrawer);
  $("#dResolve").addEventListener("click", async () => {
    if (!state.current) return;
    const btn = $("#dResolve");
    const next = state.current.status === "open" ? "done" : "open";
    btn.disabled = true;
    try {
      await api(`/api/admin/feedback/${state.current.id}`, {
        method: "PATCH",
        body: JSON.stringify({ status: next }),
      });
      state.current.status = next;
      closeDrawer();
      await Promise.all([loadFeedback(), loadOverview()]);
      toast(next === "done" ? "已标记为已处理" : "已改回未处理");
    } catch (err) {
      // 之前这里没有 catch，失败时界面上什么都看不到
      toast(`操作失败：${err.status || "网络"} ${err.message || ""}`.trim(), true);
    } finally {
      btn.disabled = false;
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if ($("#lightbox").classList.contains("show")) { closeLightbox(); return; }
    closeDrawer();
  });

  /* 主题：跟随上次选择，没有就用系统 */
  const savedTheme = localStorage.getItem("hugdata-theme");
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  else if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark";
  $("#themeBtn").addEventListener("click", () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    localStorage.setItem("hugdata-theme", next);
    if (chartMeta) drawChart(chartMeta.values, chartMeta.days);
  });

  function closeLightbox() {
    $("#lightbox").classList.remove("show");
    $("#lightbox").setAttribute("aria-hidden", "true");
    $("#lightboxImg").removeAttribute("src");
  }

  let toastTimer = null;
  function toast(message, isError = false) {
    const el = $("#toast");
    el.textContent = message;
    el.style.background = isError ? "var(--red)" : "var(--text)";
    el.style.color = isError ? "#fff" : "var(--bg)";
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
  }

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function fmtTime(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return iso || "";
    const p = (n) => String(n).padStart(2, "0");
    return `${d.getMonth() + 1}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  async function boot() {
    try {
      await api("/api/admin/me");
    } catch (_) { return; }
    showApp();
    await loadTools();
    await Promise.all([loadOverview(), loadFeedback(), loadOrders()]);
    setInterval(() => {
      if (!document.hidden) loadOrders().catch(() => {});
    }, 30000);
  }

  boot();
})();
</script>
</body>
</html>
