<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixmint 首次引导 · 交互 Demo</title>
    <style>
      :root {
        color-scheme: light;
        --page: #ececec;
        --page-glow: rgba(2, 133, 255, 0.1);
        --card: rgba(255, 255, 255, 0.98);
        --panel: #f3f3f3;
        --panel-2: #ffffff;
        --text: #0d0d0d;
        --muted: #5d5d5d;
        --muted-2: #8f8f8f;
        --line: #00000014;
        --line-strong: #00000026;
        --ink: #0d0d0d;
        --primary-bg: #0d0d0d;
        --primary-text: #ffffff;
        --selected-bg: #ededed;
        --selected-text: #0d0d0d;
        --accent: #0285ff;
        --accent-soft: #e5f3ff;
        --accent-line: #0285ff47;
        --shadow: 0 24px 72px rgba(0, 0, 0, 0.16);
        --soft-shadow: 0 14px 36px rgba(0, 0, 0, 0.08);
      }

      body[data-theme="dark"] {
        color-scheme: dark;
        --page: #0d0d0d;
        --page-glow: rgba(58, 131, 247, 0.1);
        --card: rgba(24, 24, 24, 0.98);
        --panel: #212121;
        --panel-2: #181818;
        --text: #ffffff;
        --muted: #afafaf;
        --muted-2: #767676;
        --line: #ffffff1a;
        --line-strong: #ffffff26;
        --ink: #ffffff;
        --primary-bg: #ffffff;
        --primary-text: #0d0d0d;
        --selected-bg: #303030;
        --selected-text: #ffffff;
        --accent: #3a83f7;
        --accent-soft: #12233a;
        --accent-line: #3a83f75c;
        --shadow: 0 28px 90px rgba(0, 0, 0, 0.55);
        --soft-shadow: 0 16px 42px rgba(0, 0, 0, 0.3);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 12%, var(--page-glow), transparent 36%),
          radial-gradient(circle at 86% 82%, rgba(255, 160, 120, 0.1), transparent 34%),
          var(--page);
        color: var(--text);
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        transition: background-color 180ms ease, color 180ms ease;
      }

      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .demo-stage {
        position: relative;
        width: 920px;
        height: 590px;
        display: grid;
        place-items: center;
      }

      .demo-stage::before,
      .demo-stage::after {
        content: "";
        position: absolute;
        border-radius: 999px;
        filter: blur(2px);
        pointer-events: none;
      }

      .demo-stage::before {
        width: 230px;
        height: 230px;
        left: -86px;
        top: 42px;
        background: radial-gradient(circle, rgba(96, 178, 255, 0.18), transparent 70%);
      }

      .demo-stage::after {
        width: 280px;
        height: 280px;
        right: -110px;
        bottom: -40px;
        background: radial-gradient(circle, rgba(255, 157, 116, 0.12), transparent 70%);
      }

      .guide {
        position: relative;
        width: 860px;
        height: 548px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        box-shadow: var(--shadow);
        backdrop-filter: blur(30px) saturate(1.15);
      }

      .guide::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }

      .guide-top {
        position: relative;
        z-index: 3;
        height: 64px;
        display: flex;
        align-items: center;
        padding: 0 24px 0 28px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 156px;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.01em;
      }

      .brand-mark {
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        color: var(--primary-text);
        background: var(--primary-bg);
        box-shadow: 0 5px 14px rgba(10, 12, 18, 0.18);
      }

      .brand-mark svg {
        width: 17px;
        height: 17px;
      }

      .stepper {
        position: absolute;
        left: 50%;
        top: 50%;
        display: flex;
        align-items: center;
        gap: 9px;
        transform: translate(-50%, -50%);
      }

      .step-dot {
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line-strong);
        border-radius: 50%;
        color: var(--muted-2);
        font: 600 10px/1 var(--mono, "Cascadia Mono", monospace);
        transition: all 180ms ease;
      }

      .step-dot.active {
        color: var(--primary-text);
        border-color: var(--primary-bg);
        background: var(--primary-bg);
      }

      .step-line {
        width: 28px;
        height: 1px;
        background: var(--line-strong);
      }

      .top-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .theme-toggle,
      .skip {
        height: 30px;
        padding: 0 11px;
        border-radius: 8px;
        color: var(--muted);
        font-size: 12px;
        transition: background 160ms ease, color 160ms ease;
      }

      .theme-toggle:hover,
      .skip:hover {
        color: var(--text);
        background: var(--accent-soft);
      }

      .pages {
        position: relative;
        z-index: 2;
        height: 408px;
      }

      .page {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 48% 52%;
        opacity: 0;
        visibility: hidden;
        transform: translateY(8px) scale(0.996);
        transition:
          opacity 300ms ease,
          transform 420ms cubic-bezier(0.22, 1, 0.36, 1),
          visibility 0s linear 420ms;
        pointer-events: none;
      }

      .page.active {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
        transition-delay: 0s;
        pointer-events: auto;
      }

      .copy {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 38px 34px 36px 52px;
      }

      .eyebrow {
        width: fit-content;
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 16px;
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 16px;
        height: 1px;
        background: currentColor;
      }

      h1 {
        margin: 0;
        max-width: 390px;
        font-size: 35px;
        line-height: 1.18;
        letter-spacing: -0.045em;
        font-weight: 700;
      }

      .lead {
        max-width: 350px;
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 13.5px;
        line-height: 1.78;
      }

      .shortcut-card {
        width: 292px;
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 25px;
        padding: 13px 15px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel-2);
        box-shadow: 0 8px 26px rgba(38, 54, 82, 0.06);
      }

      .keycap {
        width: 48px;
        height: 44px;
        display: grid;
        place-items: center;
        flex: none;
        border: 1px solid var(--line-strong);
        border-bottom-width: 3px;
        border-radius: 8px;
        background: var(--panel-2);
        font-size: 15px;
        font-weight: 750;
        animation: keyPress 4.8s ease-in-out infinite;
      }

      .shortcut-copy strong {
        display: block;
        margin-bottom: 4px;
        font-size: 12.5px;
        font-weight: 650;
      }

      .shortcut-copy span {
        color: var(--muted);
        font-size: 11.5px;
      }

      .feature-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 20px;
        color: var(--muted-2);
        font-size: 11px;
      }

      .feature-row i {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: var(--muted-2);
      }

      .visual {
        position: relative;
        overflow: hidden;
        margin: 0 22px 22px 0;
        border: 1px solid var(--line);
        border-radius: 12px;
        background:
          radial-gradient(circle at 76% 18%, color-mix(in srgb, var(--accent) 13%, transparent), transparent 34%),
          linear-gradient(145deg, var(--panel-2), var(--panel));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.42), var(--soft-shadow);
      }

      .visual::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.55;
        background-image:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 34px 34px;
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), transparent 82%);
      }

      .desk-window {
        position: absolute;
        left: 36px;
        top: 44px;
        width: 350px;
        height: 250px;
        overflow: hidden;
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        background: var(--panel-2);
        box-shadow: 0 22px 46px rgba(34, 56, 90, 0.12);
      }

      .desk-top {
        height: 28px;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 0 10px;
        border-bottom: 1px solid var(--line);
      }

      .desk-top i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--line-strong);
      }

      .desk-body {
        position: relative;
        height: calc(100% - 28px);
        display: grid;
        grid-template-columns: 78px 1fr;
      }

      .desk-side {
        border-right: 1px solid var(--line);
        padding: 15px 12px;
      }

      .desk-side span,
      .desk-lines span {
        display: block;
        height: 5px;
        margin-bottom: 10px;
        border-radius: 99px;
        background: var(--line-strong);
      }

      .desk-main {
        position: relative;
        padding: 18px;
      }

      .desk-hero {
        height: 76px;
        border-radius: 8px;
        background:
          radial-gradient(circle at 72% 24%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 28%),
          linear-gradient(120deg, color-mix(in srgb, var(--accent) 14%, transparent), rgba(255, 255, 255, 0.02));
      }

      .desk-lines {
        margin-top: 16px;
      }

      .desk-lines span:nth-child(1) {
        width: 84%;
      }

      .desk-lines span:nth-child(2) {
        width: 64%;
      }

      .desk-lines span:nth-child(3) {
        width: 72%;
      }

      .capture-rect {
        position: absolute;
        left: 112px;
        top: 73px;
        width: 2px;
        height: 2px;
        z-index: 2;
        border: 1.5px solid var(--accent);
        border-radius: 2px;
        background: color-mix(in srgb, var(--accent) 3.5%, transparent);
      }

      .capture-rect::before {
        content: "区域截图";
        position: absolute;
        left: -1px;
        bottom: calc(100% + 7px);
        padding: 4px 7px;
        border-radius: 6px;
        color: #fff;
        background: var(--accent);
        font-size: 9px;
        font-weight: 600;
        white-space: nowrap;
      }

      .capture-rect i {
        position: absolute;
        width: 5px;
        height: 5px;
        border: 1px solid var(--accent);
        background: var(--panel-2);
      }

      .capture-rect i:nth-child(1) {
        left: -3px;
        top: -3px;
      }

      .capture-rect i:nth-child(2) {
        right: -3px;
        top: -3px;
      }

      .capture-rect i:nth-child(3) {
        left: -3px;
        bottom: -3px;
      }

      .capture-rect i:nth-child(4) {
        right: -3px;
        bottom: -3px;
      }

      .capture-cursor {
        position: absolute;
        left: 112px;
        top: 73px;
        z-index: 4;
        color: var(--text);
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.22));
      }

      .capture-cursor svg {
        width: 21px;
        height: 25px;
      }

      .capture-start {
        position: absolute;
        left: 112px;
        top: 73px;
        width: 10px;
        height: 10px;
        margin: -5px 0 0 -5px;
        z-index: 5;
        border: 1.5px solid var(--accent);
        border-radius: 50%;
        opacity: 0;
      }

      .pressed-bubble {
        position: absolute;
        left: 28px;
        bottom: 24px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--muted);
        background: var(--panel-2);
        box-shadow: 0 8px 24px rgba(38, 54, 82, 0.08);
        font-size: 10.5px;
        animation: bubbleReveal 5s ease-in-out infinite;
      }

      .pressed-bubble b {
        color: var(--text);
        font-weight: 650;
      }

      .pressed-bubble i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #2ecc71;
        box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.13);
      }

      .method-list {
        display: grid;
        gap: 9px;
        margin-top: 23px;
      }

      .page-two .copy {
        padding-top: 24px;
        padding-bottom: 24px;
      }

      .page-two h1 {
        font-size: 30px;
      }

      .page-two .lead {
        margin-top: 12px;
        line-height: 1.6;
      }

      .page-two .method-list {
        gap: 6px;
        margin-top: 14px;
      }

      .page-two .method {
        padding: 8px 10px;
      }

      .page-two .method-icon {
        width: 30px;
        height: 30px;
      }

      .method {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel-2);
      }

      .method-icon {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        flex: none;
        border-radius: 8px;
        color: var(--accent);
        background: var(--accent-soft);
      }

      .method-icon svg {
        width: 21px;
        height: 21px;
      }

      .method strong {
        display: block;
        margin-bottom: 3px;
        font-size: 12px;
        font-weight: 650;
      }

      .method span {
        color: var(--muted);
        font-size: 10.5px;
      }

      .tip-line {
        display: flex;
        align-items: flex-start;
        gap: 7px;
        margin-top: 15px;
        color: var(--muted-2);
        font-size: 10.5px;
        line-height: 1.55;
      }

      .page-two .tip-line {
        margin-top: 8px;
        line-height: 1.4;
      }

      .style-note {
        margin-top: 12px;
      }

      .style-note-head {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 7px;
        color: var(--muted);
        font-size: 10.5px;
        font-weight: 650;
      }

      .style-note-head::before {
        content: "";
        width: 13px;
        height: 1px;
        background: var(--accent);
      }

      .line-style-board {
        display: flex;
        gap: 2px;
        width: fit-content;
        padding: 4px;
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        background: var(--panel-2);
        box-shadow: 0 6px 18px rgba(38, 54, 82, 0.06);
      }

      .line-style-cell {
        width: 49px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        color: var(--muted);
        transition: background 150ms ease, color 150ms ease;
      }

      .line-style-cell:hover {
        color: var(--text);
        background: var(--accent-soft);
      }

      .line-style-cell.on {
        color: var(--selected-text);
        background: var(--selected-bg);
      }

      .line-style-canvas {
        display: block;
      }

      .tip-line svg {
        width: 13px;
        height: 13px;
        flex: none;
        margin-top: 1px;
      }

      .draw-stage {
        position: absolute;
        inset: 30px 34px 28px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel-2);
        overflow: hidden;
      }

      .mode-chips {
        position: absolute;
        left: 16px;
        top: 15px;
        z-index: 3;
        display: flex;
        gap: 6px;
      }

      .chip {
        padding: 6px 10px;
        border-radius: 8px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 650;
        transition: background 180ms ease, color 180ms ease;
      }

      .chip-drag {
        animation: chipDrag 8s ease-in-out infinite;
      }

      .chip-two {
        animation: chipTwo 8s ease-in-out infinite;
      }

      .draw-canvas {
        position: absolute;
        inset: 42px 12px 38px;
      }

      .draw-canvas svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .demo-line {
        fill: none;
        stroke: var(--accent);
        stroke-width: 3.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }

      .arrow-head {
        fill: var(--accent);
        opacity: 0;
      }

      .arrow-drag {
        animation: dragArrow 8s ease-in-out infinite;
      }

      .arrow-two {
        animation: twoArrow 8s ease-in-out infinite;
      }

      .pointer {
        opacity: 0;
        color: var(--text);
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.18));
      }

      .click-point {
        fill: var(--accent);
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
      }

      .click-start {
        animation: startPoint 8s ease-in-out infinite;
      }

      .click-end {
        animation: endPoint 8s ease-in-out infinite;
      }

      .click-ring {
        fill: none;
        stroke: var(--accent);
        stroke-width: 1.4;
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
      }

      .ring-start {
        animation: startRing 8s ease-in-out infinite;
      }

      .ring-end {
        animation: endRing 8s ease-in-out infinite;
      }

      .mode-caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 12px;
        text-align: center;
        color: var(--muted-2);
        font-size: 9.5px;
        letter-spacing: 0.04em;
      }

      .replay {
        position: absolute;
        right: 13px;
        bottom: 9px;
        z-index: 4;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 5px 7px;
        border-radius: 8px;
        color: var(--muted);
        font-size: 9.5px;
      }

      .replay:hover {
        color: var(--text);
        background: var(--accent-soft);
      }

      .replay svg {
        width: 12px;
        height: 12px;
      }

      .guide-foot {
        position: relative;
        z-index: 3;
        height: 76px;
        display: flex;
        align-items: center;
        padding: 0 28px 0 52px;
        border-top: 1px solid var(--line);
      }

      .dots {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .dots i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--line-strong);
        transition: width 180ms ease, background 180ms ease;
      }

      .dots i.active {
        width: 18px;
        border-radius: 99px;
        background: var(--ink);
      }

      .foot-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
      }

      .ghost-btn,
      .primary-btn {
        height: 38px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 650;
        transition: transform 160ms ease, opacity 160ms ease, background 160ms ease;
      }

      .ghost-btn {
        padding: 0 15px;
        color: var(--muted);
      }

      .ghost-btn:hover {
        color: var(--text);
        background: var(--accent-soft);
      }

      .ghost-btn[hidden] {
        display: none;
      }

      .primary-btn {
        min-width: 102px;
        padding: 0 20px;
        color: var(--primary-text);
        background: var(--primary-bg);
        box-shadow: 0 9px 24px rgba(18, 22, 31, 0.18);
      }

      .primary-btn:hover {
        transform: translateY(-1px);
        opacity: 0.92;
      }

      .primary-btn:active {
        transform: translateY(0);
      }

      .demo-toast {
        position: absolute;
        left: 50%;
        bottom: 26px;
        z-index: 8;
        padding: 10px 15px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--text);
        background: var(--card);
        box-shadow: var(--soft-shadow);
        font-size: 11px;
        opacity: 0;
        transform: translate(-50%, 8px);
        transition: opacity 180ms ease, transform 180ms ease;
        pointer-events: none;
      }

      .demo-toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      @keyframes keyPress {
        0%,
        22%,
        42%,
        100% {
          transform: translateY(0);
          border-bottom-width: 3px;
          background: var(--panel-2);
        }
        29% {
          transform: translateY(2px);
          border-bottom-width: 1px;
          background: var(--accent-soft);
        }
        35% {
          transform: translateY(0);
          border-bottom-width: 3px;

    <script>
      function subdivide(points, count) {
        if (points.length !== 2) return points.slice()
        const out = []
        for (let i = 0; i <= count; i += 1) {
          const t = i / count
          out.push({
            x: points[0].x + (points[1].x - points[0].x) * t,
            y: points[0].y + (points[1].y - points[0].y) * t
          })
        }
        return out
      }

      function wobble(points, amplitude) {
        return points.map((point, index) => {
          const t = Math.min(index, points.length - 2)
          const dx = points[t + 1].x - points[t].x
          const dy = points[t + 1].y - points[t].y
          const length = Math.hypot(dx, dy) || 1
          const fade = Math.min(1, Math.sin((Math.PI * index) / Math.max(1, points.length - 1)) * 3)
          const wave =
            Math.sin(index * 0.33 + points.length * 0.13) * 0.82 +
            Math.sin(index * 0.61 + 1.4) * 0.18
          const jitter = wave * amplitude * fade
          return {
            x: point.x + (-dy / length) * jitter,
            y: point.y + (dx / length) * jitter
          }
        })
      }

      function strokePathStyled(ctx, points, style, baseW, color) {
        if (points.length < 2) return
        ctx.strokeStyle = color
        ctx.lineCap = "round"
        ctx.lineJoin = "round"
        const trace = (arr) => {
          ctx.beginPath()
          arr.forEach((point, index) => {
            if (index === 0) ctx.moveTo(point.x, point.y)
            else ctx.lineTo(point.x, point.y)
          })
          ctx.stroke()
        }
        if (style === "thin") {
          ctx.lineWidth = Math.max(1.1, baseW * 0.6)
          trace(points)
        } else if (style === "dotted") {
          ctx.lineWidth = baseW
          ctx.setLineDash([baseW * 0.7, baseW * 2.1])
          trace(points)
          ctx.setLineDash([])
        } else if (style === "sketch") {
          const total = points.reduce((sum, point, index) => {
            if (!index) return sum
            return sum + Math.hypot(point.x - points[index - 1].x, point.y - points[index - 1].y)
          }, 0)
          const sampleCount = Math.max(24, Math.min(220, Math.round(total / 1.2)))
          const amplitude = Math.max(baseW * 0.12, Math.min(baseW * 0.45, total / 160))
          const sub = wobble(subdivide(points, sampleCount), amplitude)
          const traceSmooth = () => {
            ctx.beginPath()
            ctx.moveTo(sub[0].x, sub[0].y)
            for (let i = 1; i < sub.length - 1; i += 1) {
              const nextX = (sub[i].x + sub[i + 1].x) / 2
              const nextY = (sub[i].y + sub[i + 1].y) / 2
              ctx.quadraticCurveTo(sub[i].x, sub[i].y, nextX, nextY)
            }
            const last = sub[sub.length - 1]
            ctx.lineTo(last.x, last.y)
            ctx.stroke()
          }
          const pass = (widthScale, alpha, dx, dy) => {
            ctx.save()
            ctx.globalAlpha = alpha
            ctx.translate(dx, dy)
            ctx.lineWidth = Math.max(0.8, baseW * widthScale)
            traceSmooth()
            ctx.restore()
          }
          pass(0.62, 0.14, 0.6, -0.45)
          pass(1, 1, 0, 0)
        } else {
          ctx.lineWidth = baseW
          trace(points)
        }
      }

      function drawPreviewArrow(ctx, style, x1, y1, x2, y2, baseW, color, height) {
        const dx = x2 - x1
        const dy = y2 - y1
        const length = Math.hypot(dx, dy)
        if (length < 0.5) return
        const ux = dx / length
        const uy = dy / length
        const px = -uy
        const py = ux
        const scale = height / 18
        const metrics =
          style === "thin"
            ? { length: 9 * scale, halfWidth: 2.6 * scale, sketch: false, open: true }
            : style === "sketch"
              ? { length: 14 * scale, halfWidth: 4.6 * scale, sketch: true, open: false }
              : { length: 11 * scale, halfWidth: 3.2 * scale, sketch: false, open: false }
        const baseX = x2 - ux * metrics.length
        const baseY = y2 - uy * metrics.length
        const wingX = baseX + px * metrics.halfWidth
        const wingY = baseY + py * metrics.halfWidth
        const otherX = baseX - px * metrics.halfWidth
        const otherY = baseY - py * metrics.halfWidth
        ctx.fillStyle = color
        ctx.strokeStyle = color
        ctx.lineCap = "round"
        ctx.lineJoin = "round"
        if (metrics.open) {
          ctx.lineWidth = Math.max(1.1, baseW * 0.6)
          ctx.beginPath()
          ctx.moveTo(wingX, wingY)
          ctx.lineTo(x2, y2)
          ctx.lineTo(otherX, otherY)
          ctx.stroke()
          return
        }
        ctx.beginPath()
        ctx.moveTo(x2, y2)
        ctx.lineTo(wingX, wingY)
        if (metrics.sketch) {
          ctx.quadraticCurveTo(
            baseX + ux * metrics.length * 0.28,
            baseY + uy * metrics.length * 0.28,
            otherX,
            otherY
          )
        } else {
          ctx.lineTo(otherX, otherY)
        }
        ctx.closePath()
        ctx.fill()
      }

      function drawLineStylePreviews() {
        const width = 46
        const height = 14
        const dpr = window.devicePixelRatio || 1
        const baseW = Math.max(2, Math.min(3.4, height / 5.5))
        const midY = height / 2
        const tipX = width - 3
        const lineEndX = tipX - Math.max(4, baseW * 2)
        document.querySelectorAll(".line-style-canvas").forEach((canvas) => {
          canvas.width = width * dpr
          canvas.height = height * dpr
          canvas.style.width = `${width}px`
          canvas.style.height = `${height}px`
          const ctx = canvas.getContext("2d")
          if (!ctx) return
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
          ctx.clearRect(0, 0, width, height)
          strokePathStyled(
            ctx,
            [
              { x: 4, y: midY },
              { x: lineEndX, y: midY }
            ],
            canvas.dataset.lineStyle || "solid",
            baseW,
            "#e64545"
          )
          drawPreviewArrow(
            ctx,
            canvas.dataset.lineStyle || "solid",
            4,
            midY,
            tipX,
            midY,
            baseW,
            "#e64545",
            height
          )
        })
      }

      function animateCapture() {
        const rect = document.querySelector(".capture-rect")
        const cursor = document.querySelector(".capture-cursor")
        const start = document.querySelector(".capture-start")
        if (!rect || !cursor || !start) return
        const duration = 5000
        const maxWidth = 156
        const maxHeight = 106
        const started = performance.now()
        const ease = (value) => value * value * (3 - 2 * value)
        const tick = (now) => {
          const progress = ((now - started) % duration) / duration
          let width = 2
          let height = 2
          let opacity = 0
          let pointerOpacity = 0
          let startOpacity = 0
          let startScale = 0.4
          if (progress >= 0.18 && progress < 0.24) {
            opacity = 1
            pointerOpacity = 1
          } else if (progress >= 0.24 && progress < 0.56) {
            const value = ease((progress - 0.24) / 0.32)
            width = 2 + (maxWidth - 2) * value
            height = 2 + (maxHeight - 2) * value
            opacity = 1
            pointerOpacity = 1
          } else if (progress >= 0.56 && progress < 0.84) {
            width = maxWidth
            height = maxHeight
            opacity = 1
            pointerOpacity = 1
          } else if (progress >= 0.84 && progress < 0.9) {
            const value = (progress - 0.84) / 0.06
            width = maxWidth
            height = maxHeight
            opacity = 1 - value
            pointerOpacity = 1 - value
          }
          if (progress >= 0.18 && progress < 0.3) {
            const value = (progress - 0.18) / 0.12
            startOpacity = value < 0.25 ? (value / 0.25) * 0.9 : 0.9 * (1 - (value - 0.25) / 0.75)
            startScale = 0.4 + value * 1.8
          }
          rect.style.width = `${width}px`
          rect.style.height = `${height}px`
          rect.style.opacity = String(opacity)
          cursor.style.transform = `translate(${width}px, ${height}px)`
          cursor.style.opacity = String(pointerOpacity)
          start.style.opacity = String(startOpacity)
          start.style.transform = `scale(${startScale})`
          window.requestAnimationFrame(tick)
        }
        window.requestAnimationFrame(tick)
      }

      const body = document.body
      const guide = document.getElementById("guide")
      const pages = Array.from(document.querySelectorAll("[data-page]"))
      const stepDots = Array.from(document.querySelectorAll("[data-step-dot]"))
      const dots = Array.from(document.querySelectorAll("[data-dot]"))
      const prev = document.getElementById("prev")
      const next = document.getElementById("next")
      const toast = document.getElementById("toast")
      const themeToggle = document.getElementById("themeToggle")
      let current = 1
      let toastTimer = 0

      function setStep(step) {
        current = step
        pages.forEach((page) => page.classList.toggle("active", Number(page.dataset.page) === step))
        stepDots.forEach((dot) => dot.classList.toggle("active", Number(dot.dataset.stepDot) === step))
        dots.forEach((dot) => dot.classList.toggle("active", Number(dot.dataset.dot) === step))
        prev.hidden = step === 1
        next.textContent = step === 1 ? "下一步" : "开始使用"
        if (step === 2) replay()
      }

      function replay() {
        ;[".chip-drag", ".chip-two", "#drawCanvas"].forEach((selector) => {
          const element = document.querySelector(selector)
          if (!element) return
          element.replaceWith(element.cloneNode(true))
        })
      }

      function showToast(message) {
        window.clearTimeout(toastTimer)
        toast.textContent = message
        toast.classList.add("show")
        toastTimer = window.setTimeout(() => toast.classList.remove("show"), 2100)
      }

      function syncThemeLabel() {
        themeToggle.textContent = body.dataset.theme === "dark" ? "浅色预览" : "深色预览"
      }

      body.dataset.theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
      syncThemeLabel()
      animateCapture()
      drawLineStylePreviews()

      themeToggle.addEventListener("click", () => {
        body.dataset.theme = body.dataset.theme === "dark" ? "light" : "dark"
        syncThemeLabel()
      })

      next.addEventListener("click", () => {
        if (current === 1) {
          setStep(2)
          return
        }
        showToast("引导已完成 · Demo 会在这里关闭窗口")
      })

      prev.addEventListener("click", () => setStep(1))

      document.getElementById("skip").addEventListener("click", () => {
        showToast("已跳过引导 · Demo 会在这里关闭窗口")
      })

      document.getElementById("replay").addEventListener("click", replay)

      guide.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight" && current === 1) setStep(2)
        if (event.key === "ArrowLeft" && current === 2) setStep(1)
      })
    </script>
  </body>
</html>
